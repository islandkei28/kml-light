<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 読み込みと通信を自分自身と地図タイル（国土地理院・OSM）だけに限る -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data: blob: https://cyberjapandata.gsi.go.jp https://tile.openstreetmap.org; connect-src 'self' https://cyberjapandata.gsi.go.jp https://tile.openstreetmap.org; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- OSM のタイルは送り元のサイトを求めるので、サイトのアドレスだけ送る（ページのパスは送らない） -->
  <meta name="referrer" content="strict-origin">
  <title>KMLライト</title>
  <meta name="theme-color" content="#1f7a5a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KMLライト">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/maplibre-gl-4.7.1/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/maplibre-gl-4.7.1/maplibre-gl-csp.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="map"></div>
  <button id="baseBtn" class="chip" aria-haspopup="menu" aria-expanded="false">地図：標準 ▾</button>
  <div id="baseMenu" class="menu" role="menu" hidden></div>

  <section id="sheet" class="sheet">
    <header class="sheet-head">
      <button id="sheetToggle" class="plain">ルート <span id="count"></span> <span class="caret">▾</span></button>
      <span class="head-btns">
        <button id="toolsBtn" aria-expanded="false" aria-label="その他">⋯</button>
        <button id="openBtn" class="primary">＋ 開く</button>
      </span>
      <input id="fileInput" type="file" class="vh" multiple>
    </header>

    <div id="tools" class="tools" hidden>
      <input id="search" type="search" placeholder="名前・日付で探す（例：2025-08）" autocomplete="off">
      <div class="row start">
        <button id="showAll">全部表示</button>
        <button id="hideAll">全部隠す</button>
        <button id="yearMode" aria-pressed="false">年で色分け</button>
        <button id="backupBtn">バックアップを書き出す</button>
      </div>
      <p class="hint">開くボタンでは、複数のKML/KMZ/GPX、ログを詰めたzip（Stravaの一括書き出しも）、バックアップ（.json.gz）も選べます。</p>
    </div>

    <div id="conv" class="conv" hidden>
      <div class="conv-file"><b id="convName"></b> <small id="convSize"></small></div>
      <div class="seg" role="radiogroup" aria-label="間引きの強さ">
        <label><input type="radio" name="tol" value="1"><span>細かい<br><small>1m</small></span></label>
        <label><input type="radio" name="tol" value="3" checked><span>ふつう<br><small>3m</small></span></label>
        <label><input type="radio" name="tol" value="10"><span>軽い<br><small>10m</small></span></label>
        <label><input type="radio" name="tol" value="30"><span>とても軽い<br><small>30m</small></span></label>
      </div>
      <progress id="convProg" max="1" value="0"></progress>
      <p id="convStat" class="stat"></p>
      <div class="row">
        <button id="convCancel">やめる</button>
        <button id="convSave" class="primary" disabled>保存</button>
        <button id="convStart" class="primary" hidden>取り込む</button>
      </div>
    </div>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty">KML / KMZ / GPX を開くと、線を軽くして地図に表示します。まとめて選んだり、zip で入れたりもできます。</p>
  </section>

  <div id="toast" class="toast" role="status"></div>
</body>
</html>
